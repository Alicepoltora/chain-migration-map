server {
    listen 80;
    listen [::]:80;
    server_name nansen.arcstone.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/chain-migration-map;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name nansen.arcstones.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/chain-migration-map;
    }

    location / {
        return 301 https://nansen.arcstones.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nansen.arcstones.xyz;

    ssl_certificate /etc/letsencrypt/live/nansen.arcstones.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nansen.arcstones.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
